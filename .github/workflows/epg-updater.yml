name: EPG Updater

on:
  schedule:
    - cron: '0 8 * * *'  # 08:00 UTC (5h Brasília)
    - cron: '0 20 * * *' # 20:00 UTC (17h Brasília)
  workflow_dispatch:

jobs:
  update-epg:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # Permissão essencial para poder fazer push
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}  # Usando o token automático do GitHub
        fetch-depth: 0  # Importante para operações git

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: dom, libxml, simplexml, curl
        
    - name: Run EPG Script
      env:
        API_URL: ${{ secrets.API_URL }}
        EPG_URLS: ${{ secrets.EPG_URLS }}
      run: php epg-script.php
      
    - name: Commit and Push Changes
      run: |
        # Configuração do Git
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
        # Verifica se houve mudanças no arquivo
        if git diff --quiet --exit-code -- epg.xml; then
          echo "Nenhuma alteração detectada no EPG."
        else
          echo "Atualizando EPG..."
          git add epg.xml
          git commit -m "Atualização automática do EPG [skip ci]"
          git push
        fi
